<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueGhost 👻 - Anonymous Bluetooth Chat</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="hero-container">
        <div class="glass-card p-5 max-w-md mx-auto position-relative overflow-hidden text-center" style="max-width: 580px;">
            <div class="ghost-logo mb-3">👻</div>
            <h1 class="glow-title">BlueGhost</h1>
            <p class="subtitle">Anonymous Offline Bluetooth Chat</p>

            <div class="my-4">
                <span class="identity-badge">
                    <i class="fa-solid fa-user-secret"></i>
                    Your Identity: <span id="ghostIdentityDisplay">{{ identity }}</span>
                </span>
            </div>

            <p class="text-secondary small mb-4">
                No Accounts • No Internet Required • Ephemeral AES Encryption • Self-Destruct Messages
            </p>

            <div class="d-grid gap-3 col-10 mx-auto">
                <a href="{{ url_for('chat_page') }}" class="btn btn-neon-purple btn-lg py-3">
                    <i class="fa-solid fa-ghost me-2"></i> Start Haunting
                </a>
                <a href="{{ url_for('qr_page') }}" target="_blank" class="btn btn-neon-cyan btn-md py-2">
                    <i class="fa-solid fa-qrcode me-2"></i> Show Bluetooth QR Code
                </a>
            </div>

            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-around text-muted small">
                <span><i class="fa-brands fa-bluetooth-b me-1 text-info"></i> BLE Powered</span>
                <span><i class="fa-solid fa-lock me-1 text-warning"></i> AES-256</span>
                <span><i class="fa-solid fa-bolt me-1 text-primary"></i> Socket.IO</span>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
